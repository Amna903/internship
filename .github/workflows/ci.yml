# Each week is a self-contained app, so each is checked on its own. To save GitHub Actions minutes, the
# "plan" job runs only the jobs a push needs (.github/scripts/ci_plan.sh): the changed week's backend,
# frontend and (if ml/ or requirements changed) ML reproducibility. Markdown and docs/ never trigger jobs on
# their own. The FULL Week 1-6 regression runs on manual runs (Actions → CI → Run workflow), pushes to main,
# and pull requests to main, week4 or week5 when opened, reopened or marked ready for review.
# To make failures block merging, mark the "ci-passed" job as a required status check in the
# repository's branch protection rule for main (Settings → Branches).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      ml: ${{ steps.plan.outputs.ml }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/scripts/ci_plan.sh | tee -a "$GITHUB_OUTPUT"

  backend:
    name: backend (${{ matrix.week }}, ${{ matrix.db }})
    needs: plan
    if: needs.plan.outputs.backend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        week: ${{ fromJSON(needs.plan.outputs.backend) }}
        db: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      # Week 5 Step 10: the real-worker job test needs a real Redis broker (REQUIRE_REDIS=1: it must not skip).
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.week }}/backend
    env:
      # Only for the postgres leg; the sqlite leg leaves it empty and settings fall back to SQLite.
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://ci:ci@localhost:5432/ci' || '' }}
      DJANGO_SETTINGS_MODULE: config.settings_test
      REQUIRE_REDIS: "1"
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.week }}/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are complete (no model change without a migration)
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        if: matrix.week != 'week6'
        run: python -m pytest -q
      # Week 6 Step 5: lint/format, then the suite split into named groups (one run each, no repeats).
      - name: Lint and format (ruff)
        if: matrix.week == 'week6'
        run: pip install ruff==0.14.3 && ruff check . && ruff format --check .
      - name: Unit and API integration tests
        if: matrix.week == 'week6'
        run: python -m pytest -m "not rag and not ml_pipeline and not security"
      - name: Security regression tests (authorization matrix, secret scan, uploads, injection, write approvals)
        if: matrix.week == 'week6'
        run: python -m pytest -m security
      - name: RAG regression tests (frozen retrieval, generation and conversation sets, fake model)
        if: matrix.week == 'week6'
        run: python -m pytest -m "rag and not security"
      - name: Model-pipeline smoke tests
        if: matrix.week == 'week6'
        run: python -m pytest -m "ml_pipeline and not security"

  frontend:
    name: frontend (${{ matrix.week }})
    needs: plan
    if: needs.plan.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        week: ${{ fromJSON(needs.plan.outputs.frontend) }}
    defaults:
      run:
        working-directory: ${{ matrix.week }}/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.week }}/frontend/package-lock.json
      - run: npm ci
      - name: Lint and format (ESLint, Prettier)
        if: matrix.week == 'week6'
        run: npm run lint && npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Week 3 acceptance check A1 (and Week 4 A4), visible as its own job: rebuild the dataset, reports and
  # model from scratch, exactly as the README documents, and compare with the committed files.
  ml-reproducibility:
    name: ML reproducibility (${{ matrix.week }})
    needs: plan
    if: needs.plan.outputs.ml != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        week: ${{ fromJSON(needs.plan.outputs.ml) }}
    defaults:
      run:
        working-directory: ${{ matrix.week }}/backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.week }}/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Generate the dataset (prints its SHA-256)
        run: python -m ml.data
      - name: Rebuild reports and model, compare with the committed release
        run: python -m ml.verify_release

  # Single required check for branch protection: fails if the plan failed, or any job it asked for failed or
  # was cancelled. A job the plan skipped (nothing in it changed) counts as passing.
  # Week 6 Step 5 (the user's rule: Docker jobs only on PRs or manual runs, to save minutes). Builds both
  # images, starts the stack with the fake LLM/embedder, and runs API integration checks against the containers.
  docker:
    name: docker stack (week6)
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week6
    steps:
      - uses: actions/checkout@v4
      - name: Create a CI .env (fake model, generated secrets)
        run: |
          python3 backend/scripts/init_env.py > /dev/null
          printf 'ASSISTANT_PROVIDER=fake\nASSISTANT_EMBEDDER=fake\n' >> backend/.env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API integration checks against the containers
        run: python3 e2e/api_integration.py http://127.0.0.1:3000 http://127.0.0.1:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80

  ci-passed:
    if: always()
    needs: [plan, backend, frontend, ml-reproducibility, docker]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          [ "${{ needs.plan.result }}" = "success" ] && ok "${{ needs.backend.result }}" \
            && ok "${{ needs.frontend.result }}" && ok "${{ needs.ml-reproducibility.result }}" \
            && ok "${{ needs.docker.result }}"
