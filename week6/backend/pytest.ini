[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
testpaths = tests
addopts = -q
markers =
    rag: RAG regression tests (retrieval, generation, conversations, indexing)
    ml_pipeline: model-pipeline smoke tests (training, clustering, holdout, release rule)
    security: high-risk regression tests (authorization, uploads, injection, write approvals, secrets)
