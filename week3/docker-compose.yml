# Local PostgreSQL for development. Credentials here are throwaway dev values, not secrets.
#   docker compose up -d db
#   then in backend/.env:  DATABASE_URL=postgres://healthprofile:healthprofile@localhost:5432/healthprofile
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: healthprofile
      POSTGRES_USER: healthprofile
      POSTGRES_PASSWORD: healthprofile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
